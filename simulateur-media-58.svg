<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470">
 <title>Harley-Davidson — kit de poignées chauffantes en série</title>
 <desc>Le fil rouge passe par le fusible et alimente la commande. Le fil orange à rayure blanche arrive des accessoires. Les deux résistances de chauffe sont en série vers la masse par le fil noir.</desc>
 <defs>
  <style>
   text{font-family:system-ui,sans-serif;fill:#202d35}
   .label{font-size:21px;font-weight:700}
   .small{font-size:17px}
   .wire{fill:none;stroke:#38464e;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
   .red{stroke:#ac2626}
   .orange{stroke:#a34700}
   .stripe{stroke:#fff;stroke-width:1.8;stroke-dasharray:6 7}
   .black{stroke:#263139}
   .block{fill:#eff4f6;stroke:#354650;stroke-width:2}
   .red-text{fill:#8b2525}
   .orange-text{fill:#833800}
  </style>
 </defs>
