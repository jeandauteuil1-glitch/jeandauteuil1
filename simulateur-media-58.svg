 <text x="200" y="106" text-anchor="middle" class="label red-text">R · + batterie</text>
 <path class="wire orange" d="M464 113 V181 H307 V206"/>
 <path class="wire stripe" d="M464 113 V181 H307 V206"/>
 <text x="464" y="106" text-anchor="middle" class="label orange-text">O/W · + accessoires</text>
 <rect x="137" y="206" width="221" height="65" rx="9" class="block"/>
 <text x="247" y="235" text-anchor="middle" class="label">Commande</text>
 <text x="247" y="258" text-anchor="middle" class="small">de chauffage</text>
